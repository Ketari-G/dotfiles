
[icon]
dirs  = [
	{{ name = ".config", text = "", fg = "{color2}" }},
	{{ name = ".git", text = "", fg = "{color6}" }},
	{{ name = ".github", text = "", fg = "#03a9f4" }},
	{{ name = ".npm", text = "", fg = "#03a9f4" }},
	{{ name = "Desktop", text = "", fg = "{color6}" }},
	{{ name = "Development", text = "", fg = "{color6}" }},
	{{ name = "Documents", text = "", fg = "{color6}" }},
	{{ name = "Downloads", text = "", fg = "{color6}" }},
	{{ name = "Library", text = "", fg = "{color6}" }},
	{{ name = "Movies", text = "", fg = "{color6}" }},
	{{ name = "Music", text = "", fg = "{color6}" }},
	{{ name = "Pictures", text = "", fg = "{color6}" }},
	{{ name = "Public", text = "", fg = "{color6}" }},
	{{ name = "Videos", text = "", fg = "{color6}" }},
]
conds = [
	# Special files
	{{ if = "orphan", text = "", fg = "#ffffff" }},
	{{ if = "link", text = "", fg = "#9e9e9e" }},
	{{ if = "block", text = "", fg = "#cddc39" }},
	{{ if = "char", text = "", fg = "#cddc39" }},
	{{ if = "fifo", text = "", fg = "#cddc39" }},
	{{ if = "sock", text = "", fg = "#cddc39" }},
	{{ if = "sticky", text = "", fg = "#cddc39" }},
	{{ if = "dummy", text = "", fg = "#f44336" }},

	# Fallback
	{{ if = "dir & hovered", text = "", fg = "#03a9f4" }},
	{{ if = "dir", text = "", fg = "{color5}" }},
	{{ if = "exec", text = "", fg = "{color2}" }},
	{{ if = "!dir", text = "", fg = "{color1}" }},
]
